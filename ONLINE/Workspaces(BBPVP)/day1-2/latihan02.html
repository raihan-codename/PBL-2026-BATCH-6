<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Jadwal Kegiatan Harian</h1>
    <br>
    <table border="1" width="50%">
          <tr>
            <th colspan="3">Jadwal Harian Saya</th>
          </tr>
          <tr>
            <th width="25%">Waktu</th>
            <th width="35%">Kegiatan</th>
            <th width="35%">Keterangan</th>
          </tr>
          <tr>
            <td width="25%" align="center">05.00 - 06.00</td>
            <td rowspan="2" width="35%" align="center">Bangun & Persiapan</td>
            <td width="35%" align="center">Sholat, mandi, sarapan</td>
          </tr>
          <tr>
            <td width="25%" align="center">06.00 - 07.00</td>
            <td width="35%" align="center">Berangkat ke sekolah</td>
          </tr>
          <tr>
            <td width="25%" align="center">07.00 - 12.00</td>
            <td width="35%" align="center">Sekolah</td>
            <td width="35%" align="center">Belajar di kelas</td>
          </tr>
          <tr>
            <td width="25%" align="center">12.00 - 13.00</td>
            <td colspan="2" width="35%" align="center">Istirahat & Makan Siang</td>
          </tr>
        </table>
</body>
</html>
